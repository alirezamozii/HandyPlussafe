name: "code quality"
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Check translation consistency
        run: bun run check:translations

      - name: Check model language coverage
        run: bun run check:model-languages

      - name: Check bundled model catalog matches @handy-computer/models
        run: bun run check:catalog

      - name: Test keyboard utilities
        run: bun run test:keyboard

      - name: Run frontend unit tests
        run: bun test src/lib/voiceEdit/engine.test.ts src/lib/wakeWord/matcher.test.ts src/components/settings/history/clipboard.test.ts src/components/update-checker/portableInstaller.test.ts src/lib/utils/keyboard.test.ts

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier
        run: bun run format:check
